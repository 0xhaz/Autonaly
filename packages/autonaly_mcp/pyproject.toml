[project]
name = "autonaly-mcp"
version = "0.1.0"
description = "MCP server: the exposure engine, agent-queryable. Thin tools over the deterministic HTTP API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
autonaly-mcp = "autonaly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_mcp"]
