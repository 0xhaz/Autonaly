[project]
name = "autonaly-core"
version = "0.1.0"
description = "Shared contracts: event schema, settings, and the local|gcp ports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.26",
    "google-cloud-firestore>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_core"]
