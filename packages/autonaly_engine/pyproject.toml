[project]
name = "autonaly-engine"
version = "0.1.0"
description = "Deterministic exposure engine (FastAPI). DDR + HHI + severity ladder. No LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.1",
    "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_engine"]
