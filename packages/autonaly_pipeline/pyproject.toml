[project]
name = "autonaly-pipeline"
version = "0.1.0"
description = "Offline refinery: BACI -> DuckDB -> exposure matrices (Parquet + JSON)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "duckdb>=1.1",
    "polars>=1.12",
    "pyarrow>=18.0",
    "pandera>=0.21",
    "pycountry>=24.6",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_pipeline"]
