[project]
name = "autonaly-ingest"
version = "0.1.0"
description = "Signal ingestion: PortWatch fetcher, GDELT poll handler, replay injector."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_ingest"]
