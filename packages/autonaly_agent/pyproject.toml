[project]
name = "autonaly-agent"
version = "0.1.0"
description = "ADK root agent: crisis_analyst. Classifies, routes, computes via engine, composes, queues."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "google-adk>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonaly_agent"]
