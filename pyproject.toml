[project]
name = "autonaly"
version = "0.1.0"
description = "Autonomous crisis-impact analyst — Gemini reasons, a deterministic engine computes, a human approves."
requires-python = ">=3.12,<3.13"
dependencies = [
    "autonaly-core",
    "autonaly-pipeline",
    "autonaly-engine",
    "autonaly-agent",
    "autonaly-ingest",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
    "google-genai>=1.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
autonaly-core = { workspace = true }
autonaly-pipeline = { workspace = true }
autonaly-engine = { workspace = true }
autonaly-agent = { workspace = true }
autonaly-ingest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
